<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refund Bot</title>
<link rel="stylesheet" href="static/styles.css">
</head>
<body>
<header class="top">
  <div class="brand">Dabba <span class="sep">/</span> Refund Bot</div>
  <div class="modeline" id="modeline">…</div>
</header>

<section class="objective">
  <label for="objective" class="eyebrow">System prompt</label>
  <div class="objective-row">
    <textarea id="objective" rows="10" spellcheck="false" placeholder="The bot's system prompt. Edit any line."></textarea>
    <button id="run" class="run" type="button">Run <kbd>R</kbd></button>
  </div>
</section>

<section class="score" id="stats"></section>

<section class="cards" id="cards"></section>

<section class="history" id="history"></section>

<footer class="foot">
  <span class="presets">Presets:
    <a href="#" data-preset="A">keep customers happy</a> ·
    <a href="#" data-preset="B">protect revenue</a> ·
    <a href="#" data-preset="honest">follow the policy</a>
  </span>
  <span class="keys"><kbd>R</kbd> run &nbsp; <kbd>T</kbd> show what it did &nbsp; <kbd>1</kbd>–<kbd>5</kbd> jump to a card</span>
  <span class="modeswitch">Mode:
    <a href="#" data-mode="live" id="mode-live">live</a> ·
    <a href="#" data-mode="replay" id="mode-replay">replay</a>
  </span>
</footer>

<script src="static/app.js"></script>
</body>
</html>
