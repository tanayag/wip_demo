<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refund Bot</title>
<link rel="stylesheet" href="static/styles.css">
</head>
<body>
<header class="top">
  <div class="brand">Dabba <span class="sep">/</span> Refund Bot</div>
  <div class="modeline" id="modeline">…</div>
</header>

<section class="objective">
  <label for="objective" class="eyebrow">How the bot is measured</label>
  <div class="objective-row">
    <textarea id="objective" rows="2" spellcheck="false" placeholder="Write the objective here."></textarea>
    <button id="run" class="run" type="button">Run <kbd>R</kbd></button>
  </div>
</section>

<section class="cards" id="cards"></section>

<section class="score">
  <div class="score-head">
    <div class="toggle" id="toggle" role="tablist">
      <button type="button" data-view="bot" class="on" role="tab">Bot's view</button>
      <button type="button" data-view="policy" role="tab">Policy view</button>
      <span class="hint"><kbd>E</kbd> to switch</span>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="history" id="history"></div>
</section>

<footer class="foot">
  <span class="presets">Presets:
    <a href="#" data-preset="A">keep customers happy</a> ·
    <a href="#" data-preset="B">protect revenue</a> ·
    <a href="#" data-preset="honest">follow the policy</a>
  </span>
  <span class="modeswitch">Mode:
    <a href="#" data-mode="live" id="mode-live">live</a> ·
    <a href="#" data-mode="replay" id="mode-replay">replay</a>
  </span>
</footer>

<script src="static/app.js"></script>
</body>
</html>
