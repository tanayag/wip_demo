# Server blocks for the existing EMA docker nginx (it owns 80/443 on this box).
# Host 8787 is the systemd unit; 172.17.0.1 is the docker bridge = the host.
# Live copy: /home/ubuntu/EMA/deploy/ec2/nginx.conf (mounted read-only into ec2-nginx-1).

server {
    listen 80;
    server_name wip-demo.getfluxion.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name wip-demo.getfluxion.ai;

    ssl_certificate /etc/letsencrypt/live/wip-demo.getfluxion.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wip-demo.getfluxion.ai/privkey.pem;

    location / {
        proxy_pass http://172.17.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
