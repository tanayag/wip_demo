# Snippet for an existing nginx that already owns 443 (this EC2 box: the EMA docker nginx).
# Paste inside the `server { listen 443 ssl; ... }` block. 172.17.0.1 is the docker bridge,
# i.e. the host, where the systemd unit listens on 8787.

    location = /refund-bot { return 301 /refund-bot/; }
    location /refund-bot/ {
        proxy_pass http://172.17.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
